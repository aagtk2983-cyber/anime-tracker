name: Daily Anime Tracker

on:
  schedule:
    - cron: '0 12 * * *'   # 21:00 JST = 12:00 UTC (旧: 0 15 * * * だと日本時間0:00になっていました)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      - run: pip install -r requirements.txt

      - run: python -m playwright install --with-deps chromium

      - name: Install Japanese font (グラフの日本語表示用)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: python daily_tracker.py

      - name: Plot trend
        run: python plot_trend.py

      - name: Upload HTML (デバッグ用)
        uses: actions/upload-artifact@v4
        with:
          name: page-html
          path: page.html

      - name: Commit CSV and chart
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/history.csv data/trend.png
          git commit -m "Daily Update $(date -u +'%Y-%m-%d')" || exit 0
          git push
