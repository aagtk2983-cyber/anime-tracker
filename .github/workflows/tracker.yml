name: Daily Anime Tracker

"on":
  schedule:
    - cron: "0 12 * * *"   # 21:00 JST = 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Japanese font (グラフの日本語表示用)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run tracker (登録タイトル全件のMAL・dアニメ情報を取得)
        run: python daily_tracker.py

      - name: Plot trends
        run: python plot_trend.py

      - name: Upload debug files (調査用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: data/debug_*
          if-no-files-found: ignore

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ trends/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily Update $(date -u +'%Y-%m-%d')"
          git push
