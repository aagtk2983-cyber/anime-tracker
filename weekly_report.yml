name: Weekly Anime Report

"on":
  schedule:
    - cron: "0 12 * * 0"   # 毎週日曜 21:00 JST = 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly report (Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 必要に応じてリポジトリの Settings > Secrets and variables > Actions で上書き設定可能
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_TOKEN_BUDGET: ${{ vars.GEMINI_TOKEN_BUDGET || '100000' }}
          GEMINI_MAX_GENRE_REPORTS: ${{ vars.GEMINI_MAX_GENRE_REPORTS || '8' }}
        run: python weekly_report.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Weekly report $(date -u +'%Y-%m-%d')"
          git push
